[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[project]
name = "presidio_analyzer"
version = "2.2.361"
description = "Presidio Analyzer package"
authors = [{name = "Presidio", email = "presidio@microsoft.com"}]
license = "MIT"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["presidio_analyzer"]
urls = {Homepage = "https://github.com/Microsoft/presidio"}
readme = "README.md"
include = ["conf/*",]

requires-python = ">=3.10,<3.14"
dependencies = [
    "spacy (>=3.4.4, !=3.7.0)",
    "regex",
    "tldextract",
    "pyyaml",
    "phonenumbers (>=8.12,<10.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
]

[project.optional-dependencies]
server = [
    "flask (>=1.1)",
    "gunicorn; platform_system != 'Windows'",
    "waitress; platform_system == 'Windows'"
]
transformers = [
    "transformers (<5.0.0)",
    "accelerate",
    "huggingface_hub (<1.0.0)",
    "spacy_huggingface_pipelines",
    "torch (>=2.0.0)"]

stanza = [
    "stanza (>=1.10.1,<2.0.0)",
]
azure-ai-language = [
    "azure-ai-textanalytics",
    "azure-core",
]
ahds = [
    "azure-identity (>=1.23.0,<2.0.0)",
    "azure-health-deidentification (>=1.1.0b1,<2.0.0)"
]
gliner = [
    "transformers (<5.0.0)",
    "huggingface_hub (<1.0.0)",
    "torch (>=2.0.0)",
    "gliner (>=0.2.13,<1.0.0)",
    "onnxruntime (>=1.19, <1.24.1) ; python_version == '3.10'",
    "onnxruntime (>=1.19) ; python_version > '3.10'"
]
langextract = [
    "langextract (>=1.0.0)",
    "openai (>=1.50.0)",
    "azure-identity (>=1.18.0)",
    "more-itertools (>=10.0.0)",
    "jinja2 (>=3.0.0)",
]

# CPU-only wheels avoid torch's Linux CUDA/nvidia-* dependency tree, which is
# causing poetry lock resolution failures. Revisit if GPU acceleration is needed.
[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = {version = ">=2.0.0", source = "pytorch-cpu", optional = true}

[tool.poetry.group.dev.dependencies]
pip = "*"
ruff = "*"
pytest = "*"
pytest-cov = "*"
pytest-mock = "*"
python-dotenv = "*"
pre_commit = "*"
diff-cover = "*"

[tool.coverage.run]
relative_files = true
source = ["."]
